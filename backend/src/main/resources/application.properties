spring.application.name=rikkahub-backend
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1
spring.config.import=optional:file:./config/application.local.properties,optional:file:../config/application.local.properties

# Empty means the project's data directory, independent of the working directory.
rikkahub.storage.data-directory=${RIKKAHUB_DATA_DIR:}
rikkahub.storage.busy-timeout-ms=10000
spring.flyway.locations=classpath:db/migration
spring.flyway.table=schema_migrations
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
