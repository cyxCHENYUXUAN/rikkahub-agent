# Copy to config/application.local.properties for local overrides.
server.port=8081
# Optional absolute data directory, e.g. D:/RikkaHub-Agent/data
# rikkahub.storage.data-directory=D:/RikkaHub-Agent/data
# rikkahub.storage.busy-timeout-ms=10000
# Never commit actual provider credentials.
# Browser development only; exact allowed origin is http://localhost:5173.
# rikkahub.security.development-cors=true
# Startup and runtime expired-lease reclamation share this limit.
# rikkahub.recovery.max-inbox-attempts=3
# A provider credentialRef such as env:MY_MODEL_API_KEY resolves that environment
# variable or the same named property in the PRIVATE local configuration.

# P5: observe is the default. This only limits accepted Worker concurrency.
# rikkahub.orchestration.worker-slots=2
# Optional advisory model evaluation (incurs model usage; never auto-accepts):
# rikkahub.orchestration.eval-assistant-id=YOUR_ASSISTANT_ID
# Stop background passes for controlled/manual operation:
# rikkahub.orchestration.scheduler-enabled=false

# P4 MCP: configure here, then explicitly connect from the workbench.
# rikkahub.mcp.servers[0].id=my-tools
# rikkahub.mcp.servers[0].url=http://127.0.0.1:9000/mcp
# rikkahub.mcp.servers[0].credential-ref=env:MY_MCP_TOKEN
